# GSPO Algorithm Configuration
# Examplar script for running GSPO on MMPR-Tiny dataset
grpo:
  # 512 prompts × 16 generations = 8192 trajectories (matches VERL data.train_batch_size=512)
  num_prompts_per_step: 256
  num_generations_per_prompt: 16
  max_rollout_turns: 1
  max_num_epochs: 1
  max_num_steps: 1000000
  normalize_rewards: true
  use_leave_one_out_baseline: false
  val_period: 10
  val_at_start: false 
  overlong_filtering: true
  max_val_samples: 256
  val_batch_size: 256
  seed: 42

loss_fn:
  # GSPO-style sequence-level formulation (as in VERL)
  reference_policy_kl_penalty: 0.0
  ratio_clip_min: 0.2
  ratio_clip_max: 0.2
  ratio_clip_c: null
  use_on_policy_kl_approximation: false
  use_importance_sampling_correction: false
  sequence_level_importance_ratios: true
  token_level_loss: false

checkpointing:
  enabled: true
  checkpoint_dir: "results/gspo_nano_v2_mmpr_tiny_dev"
  metric_name: "val_reward"
  higher_is_better: true
  keep_top_k: 50
  save_period: 10
  checkpoint_must_save_by: "00:03:45:00"

policy:
  model_name: "/lustre/fsw/portfolios/llmservice/users/smohsenitahe/checkpoint/mmpr_mpo_nano_v2_ga_w_hallucination_step400_itr2_nemorl"
  tokenizer:
    name: ${policy.model_name}
    chat_template: "{%- set ns = namespace(enable_thinking=true, has_sys_prompt=false) -%}{%- set msg = namespace(content='') -%}{%- for message in messages -%}{%- if message['content'] is string -%}{%- if message['role'] == 'user' or message['role'] == 'system' -%}{%- if '/think' in message['content'] -%}{%- set ns.enable_thinking = true -%}{%- elif '/no_think' in message['content'] -%}{%- set ns.enable_thinking = false -%}{%- endif -%}{%- endif -%}{%- else -%}{%- for content in message['content'] -%}{%- if content['type'] == 'text' -%}{%- if message['role'] == 'user' or message['role'] == 'system' -%}{%- if '/think' in content['text'] -%}{%- set ns.enable_thinking = true -%}{%- elif '/no_think' in content['text'] -%}{%- set ns.enable_thinking = false -%}{%- endif -%}{%- endif -%}{%- endif -%}{%- endfor -%}{%- endif -%}{%- endfor -%}{%- for message in messages %}{%- if message['content'] is string -%}{%- set msg.content = message['content'] -%}{%- else -%}{%- set msg.content = '' -%}{%- for content in message['content'] -%}{%- if content['type'] == 'image' -%}{%- set msg.content = msg.content + '<image>' -%}{%- elif content['type'] == 'video' -%}{%- set msg.content = msg.content + '<video>' -%}{%- elif content['type'] == 'text' -%}{%- set msg.content = msg.content + content['text'] -%}{%- endif -%}{%- endfor -%}{%- endif -%}{%- if message['role'] == 'system' %}{{- '<SPECIAL_10>System\n' + msg.content }}{%- if tools -%}{%- if msg.content != '' -%}{{- '\n\n' -}}{%- endif -%}{{- 'You can use the following tools to assist the user if required:\n<AVAILABLE_TOOLS>[' -}}{%- for tool in tools -%}{{- (tool.function if tool.function is defined else tool) | tojson -}}{{- ', ' if not loop.last else '' -}}{%- endfor -%}{{- ']</AVAILABLE_TOOLS>\n\nIf you decide to call any tool(s), use the following format:\n<TOOLCALL>[{{\"name\": \"tool_name1\", \"arguments\": \"tool_args1\"}}, {{\"name\": \"tool_name2\", \"arguments\": \"tool_args2\"}}]</TOOLCALL>\n\nThe user will execute tool-calls and return responses from tool(s) in this format:\n<TOOL_RESPONSE>[{{\"response\": \"tool_response1\"}}, {{\"response\": \"tool_response2\"}}]</TOOL_RESPONSE>\n\nBased on the tool responses, you can call additional tools if needed, correct tool calls if any errors are found, or just respond to the user.' -}}{%- endif -%}{{- '\n' -}}{%- elif message['role'] == 'user' %}{{- '<SPECIAL_11>User\n' + msg.content + '\n' }}{%- elif message['role'] == 'tool' %}{%- if loop.first or (messages[loop.index0 - 1].role != 'tool') -%}{{- '<SPECIAL_11>User\n' + '<TOOL_RESPONSE>[' }}{%- endif -%}{{- msg.content -}}{{- ', ' if not loop.last and (messages[loop.index0 + 1].role == 'tool') else '' -}}{%- if loop.last or (messages[loop.index0 + 1].role != 'tool') -%}{{- ']</TOOL_RESPONSE>\n' -}}{%- endif -%}{%- elif message['role'] == 'assistant' %}{%- if '</think>' in msg.content %}{%- set msg.content = msg.content %}{%- endif %}{{- '<SPECIAL_11>Assistant\n' + msg.content.strip() }}{%- if message.tool_calls -%}{%- if msg.content.strip() != '' -%}{{- '\n\n' -}}{%- endif -%}{{- '<TOOLCALL>[' -}}{%- for call in message.tool_calls -%}{%- set fn = call.function if call.function is defined else call -%}{{- '{\"name\": \"' + fn.name + '\", \"arguments\": ' -}}{%- if fn.arguments is string -%}{{- fn.arguments -}}{%- else -%}{{- fn.arguments | tojson -}}{%- endif -%}{{- '}' + (', ' if not loop.last else '') -}}{%- endfor -%}{{- ']</TOOLCALL>' -}}{%- endif -%}{{- '\n<SPECIAL_12>\n' -}}{%- endif %}{%- endfor -%}{%- if add_generation_prompt %}{{- '<SPECIAL_11>Assistant\n' }}{%- if ns.enable_thinking is defined and ns.enable_thinking is false %}{{- '<think></think>' }}{%- else %}{{- '<think>\n' }}{%- endif %}{%- endif %}"

  # VERL GSPO mini-batch and micro-batch settings
  # train_global_batch_size = PPO_MINI_BATCH_SIZE (32 prompts) × N_SAMPLES_PER_PROMPT (16) = 512 trajectories
  # Perfectly divides across 32 GPUs: 256 / 8 = 32
  train_global_batch_size: 256
  train_micro_batch_size: 8
  generation_batch_size: 8
  logprob_batch_size: 8

  # Sequence length and precision
  max_total_sequence_length: 16384
  precision: "bfloat16"

  dtensor_cfg:
    # _v2: true
    enabled: true
    cpu_offload: True  # Memory optimization
    sequence_parallel: false  # NOT SUPPORTED for VLM models
    activation_checkpointing: true
    tensor_parallel_size: 1
    context_parallel_size: 1  # MUST be 1 for VLM models
    custom_parallel_plan: null
    clear_cache_every_n_steps: 10

  # Dynamic batching token budgets aligned with VERL
  dynamic_batching:
    enabled: True
    train_mb_tokens: 16384
    logprob_mb_tokens: 16384
    sequence_length_round: 64

  make_sequence_length_divisible_by: ${policy.dtensor_cfg.tensor_parallel_size}
  max_grad_norm: 1.0

  sequence_packing:
    enabled: False

  optimizer:
    name: "torch.optim.AdamW"
    kwargs:
      lr: 1e-6
      weight_decay: 0.01
      betas: [0.9, 0.999]
      eps: 1e-8
      foreach: False
      fused: False

  scheduler:
    name: "torch.optim.lr_scheduler.ConstantLR"
    kwargs:
      factor: 1.0
      total_iters: 10000000000

  generation:
    backend: "vllm"
    # Sampling aligned with VERL GSPO
    max_new_tokens: 16384
    temperature: 1.0
    top_p: 1.0
    top_k: null
    stop_token_ids: null
    stop_strings: ["</answer>"]
    vllm_cfg:
      async_engine: false
      precision: ${policy.precision}
      tensor_parallel_size: 1
      pipeline_parallel_size: 1
      expert_parallel_size: 1
      gpu_memory_utilization: 0.85
      max_model_len: ${policy.max_total_sequence_length}
      enforce_eager: False
      skip_tokenizer_init: true
      limit_mm_per_prompt: {"image": 12}
    vllm_kwargs:
      max_num_batched_tokens: ${policy.max_total_sequence_length}
      max_num_seqs: 64
    colocated:
      enabled: true
      resources:
        gpus_per_node: null
        num_nodes: null

data:
  max_input_seq_length: ${policy.max_total_sequence_length}
  prompt_file: null
  system_prompt_file: examples/prompts/nano_v2_system_prompt.txt
  dataset_name: "mmpr_tiny"
  split: "train"
  shuffle: true
  val_size: 500
  cache_dir: "/lustre/fsw/portfolios/llmservice/users/ikarmanov/rl_datasets/mmpr_tiny_images"

env:
  mmpr_tiny:
    num_workers: 8
    reward_functions:
      - name: verl_geo3k
        weight: 1.0
        kwargs:
          format_score: 0.1

logger:
  log_dir: "logs"
  num_val_samples_to_print: 0
  wandb_enabled: true
  tensorboard_enabled: true
  mlflow_enabled: false
  swanlab_enabled: false
  monitor_gpus: true
  wandb:
    project: "grpo-dev"
    name: "gspo-nano-v2-mmpr-tiny-dev"
  tensorboard: {}
  gpu_monitoring:
    collection_interval: 10
    flush_interval: 10

cluster:
  gpus_per_node: 8
  num_nodes: 1 # Run on 8 nodes


