grpo:
  num_prompts_per_step: 512  # 16 nodes
  num_generations_per_prompt: 16
  max_rollout_turns: 1 # for multi-turn rollouts. Math Environments just have 1 turn (answering the question)
  max_num_epochs: 1
  max_num_steps: 1000000
  normalize_rewards: true
  use_leave_one_out_baseline: true
  val_period: 0
  val_at_start: false
  overlong_filtering: true
  zero_variance_prompt_filtering: false
  max_val_samples: 256
  val_batch_size: 256
  seed: 42

loss_fn:
  reference_policy_kl_penalty: 0.0
  ratio_clip_min: 0.2
  ratio_clip_max: 0.28  # Clip-Higher, ref: DAPO, JustRL
  ratio_clip_c: null
  # (default off) loss formulation improvements (docs/guides/grpo.md#loss)
  use_on_policy_kl_approximation: false
  use_importance_sampling_correction: false
  sequence_level_importance_ratios: true  # gspo
  token_level_loss: false  # gspo

checkpointing:
  enabled: true
  checkpoint_dir: "results/grpo_n5p512B_mmpr_nanov2_filtered_dev"
  metric_name: "val_reward"
  higher_is_better: true
  keep_top_k: 50
  save_period: 10
  checkpoint_must_save_by: "00:03:45:00"  # assuming 4 hour slurm jobs

policy:
  # model_name: "/lustre/fsw/portfolios/llmservice/users/smohsenitahe/checkpoint/mmpr_mpo_nano_v2_ga_w_hallucination_step400_itr2_nemorl"
  model_name: "/lustre/fsw/portfolios/llmservice/users/smohsenitahe/checkpoint/mmpr_mpo_sft_n5p5_12b_300k_13p52_cot_ruler_only_from_iter_2400_1011/step_425_nemorl"
  tokenizer:
    name: ${policy.model_name} ## specify if you'd like to use a tokenizer different from the model's default
  train_global_batch_size: 512  # 16 nodes
  train_micro_batch_size: 1
  generation_batch_size: 32 # Only used when generating using HF backend
  logprob_batch_size: 1
  max_total_sequence_length: 16384
  precision: "bfloat16"

  dtensor_cfg:
    _v2: false
    enabled: true
    cpu_offload: true
    sequence_parallel: false
    activation_checkpointing: true
    tensor_parallel_size: 1
    context_parallel_size: 1
    custom_parallel_plan: null
    clear_cache_every_n_steps: 20
    env_vars:
      NRL_REFIT_BUFFER_MEMORY_RATIO: "0.5"  # reduce refit memory pressure

  # dynamic_batching improves performance by ensuring logprob and training microbatches
  # have a sufficent number of tokens to maximize GPU utilization. Specifically, variable length
  # responses are sorted by sequence length and bucketed into microbatches with a total
  # amount of tokens is approximately close to 'train_mb_tokens' and 'logprob_mb_tokens' for the
  # training and logprob stages respectively.
  dynamic_batching:
    enabled: True
    train_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.train_micro_batch_size}}
    logprob_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.logprob_batch_size}}
    sequence_length_round: 64

  # makes the training sequence length divisible by the tensor parallel size
  # this is useful for sequence parallel training
  make_sequence_length_divisible_by: ${policy.dtensor_cfg.tensor_parallel_size}
  max_grad_norm: 1.0

  sequence_packing:
    enabled: False

  optimizer:
    name: "torch.optim.AdamW"
    kwargs:
      lr: 1e-6
      weight_decay: 0.01
      betas: [0.9, 0.99]
      eps: 1e-8
      # when using Dtensor, we need to set foreach
      # and fused to False
      foreach: False
      fused: False

  scheduler:
    name: "torch.optim.lr_scheduler.ConstantLR"
    kwargs:
      factor: 1.0
      total_iters: 10000000000

  generation:
    backend: "vllm"
    max_new_tokens: ${policy.max_total_sequence_length}
    temperature: 1.0
    top_p: 1.0  # NB. megatron-rl uses 0.9 but nemo-rl doesn't support top-p
    top_k: null
    stop_token_ids: null
    stop_strings: null
    vllm_cfg:
      async_engine: false # Only for internal testing, will be enabled by https://github.com/NVIDIA/NeMo-RL/issues/447.
      precision: ${policy.precision}
      tensor_parallel_size: 1
      pipeline_parallel_size: 1
      expert_parallel_size: 1
      gpu_memory_utilization: 0.85
      max_model_len: ${policy.max_total_sequence_length}
      enforce_eager: False
    vllm_kwargs:
      limit_mm_per_prompt: {"image": 2}
      max_num_batched_tokens: ${policy.max_total_sequence_length}
      max_num_seqs: 64
      mamba_ssm_cache_dtype: "float32"
    colocated:
      # true: generation shares training GPUs
      # false: uses dedicated generation resources
      enabled: true
      # only relevant when enabled is false
      resources:
        gpus_per_node: null # Decides num gpus to be dedicated to generation when there is one node in the cluster i.e cluster.num_nodes == 1
        num_nodes: null # Decides number of nodes to be dedicated to generation

data:
  max_input_seq_length: ${policy.max_total_sequence_length}
  train_data_path: "/lustre/fs1/portfolios/llmservice/projects/llmservice_nlp_fm/datasets/eagle-next/image_data/rl_data/mmpr1.2_nanov2_filtered/mmpr_nanov2_filtered_v1.jsonl"
  prompt_file: null
  system_prompt_file: examples/prompts/nemotron_system_prompt.txt
  dataset_name: "mmpr_nanov2_filtered"
  split: "train"
  shuffle: false  # dataset has been pre-ordered based on stratified difficulty
  val_size: 0

env:
  mmpr_nanov2_filtered:
    num_workers: 8
    reward_functions:
      - name: mmpr_filtered
        weight: 1.0
        kwargs:
          format_weight: 0.1

logger:
  log_dir: "logs"  # Base directory for all logs
  num_val_samples_to_print: 0 # Number of validation samples to pretty print on terminal
  wandb_enabled: false
  tensorboard_enabled: true
  mlflow_enabled: false  # Disable MLflow logging
  swanlab_enabled: false # Disable SwanLab logging
  monitor_gpus: true  # If true, will monitor GPU usage and log to wandb and/or tensorboard
  wandb:
    project: "grpo-dev"
    name: "grpo-dev"
  tensorboard: {}
  gpu_monitoring:
    collection_interval: 10  # How often to collect GPU usage metrics (in seconds)
    flush_interval: 10  # How often to flush GPU usage metrics to the loggers (in seconds)

cluster:
  gpus_per_node: 8
  num_nodes: 1
