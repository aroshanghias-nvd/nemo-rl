# DPO algorithm configuration
dpo:
  max_num_epochs: 1
  max_num_steps: 7000  # ~890k samples
  val_period: 100
  val_batches: 32
  val_global_batch_size: 32
  val_micro_batch_size: 1
  val_at_start: false
  seed: 42

  # reference_policy_kl_penalty: 0.1  # InternVL 3.5 recipe
  reference_policy_kl_penalty: 0.05
  preference_average_log_probs: False # whether normalizing log probs according to the sequence length in preference_loss
  sft_average_log_probs: True # whether normalizing log probs according to the sequence length in sft_loss

  ## TODO(@ashors) support other loss functions
  #preference_loss: dpo # the preference loss, we support dpo, ipo, rpo_sq, rpo_bwd_kl, rpo_fwd_kl
  #gt_reward_scale: 1. # the scale of the rewards in RPO
  preference_loss_weight: 1 # the coefficient of the preference loss
  sft_loss_weight: 0 # the coefficient of the SFT loss
  
# Data configuration for MMPR
data:
  dataset_name: "mmpr"  # MMPR dataset for multimodal preference ranking
  data_path: "/lustre/fs1/portfolios/llmservice/users/smohsenitahe/forked_rl/RL/MMPR-v1.2"
  split: "train"
  max_input_seq_length: 12000
  prompt_file: null
  system_prompt_file: null
  download_dir: null
  shuffle: true

# Policy model configuration - adjust based on your VLM model
policy:
  # model_name: "/lustre/fsw/portfolios/llmservice/users/smohsenitahe/checkpoint/sft_n5p5_12b_49152_13p51_txt_video_cot_lcb_recovery_0922_iter_0002653_hf/mcore_to_hf"
  # model_name: "/lustre/fs1/portfolios/llmservice/users/jseppanen/checkpoints/sft_n5p5_12b_49152_13p51_txt_video_cot_lcb_recovery_0922_iter_0002653_hf/nemorl"
  model_name: "/lustre/fs1/portfolios/llmservice/users/jseppanen/checkpoints/sft_n5p5_12b_300k_13p52_cot_ruler_only_from_iter_2400_1011_iter_0000440/nemorl" # GA-v2
  tokenizer:
    name: ${policy.model_name}
    chat_template: "{%- set ns = namespace(enable_thinking=true, has_sys_prompt=false) -%}{%- set msg = namespace(content='') -%}{%- for message in messages -%}{%- if message['content'] is string -%}{%- if message['role'] == 'user' or message['role'] == 'system' -%}{%- if '/think' in message['content'] -%}{%- set ns.enable_thinking = true -%}{%- elif '/no_think' in message['content'] -%}{%- set ns.enable_thinking = false -%}{%- endif -%}{%- endif -%}{%- else -%}{%- for content in message['content'] -%}{%- if content['type'] == 'text' -%}{%- if message['role'] == 'user' or message['role'] == 'system' -%}{%- if '/think' in content['text'] -%}{%- set ns.enable_thinking = true -%}{%- elif '/no_think' in content['text'] -%}{%- set ns.enable_thinking = false -%}{%- endif -%}{%- endif -%}{%- endif -%}{%- endfor -%}{%- endif -%}{%- endfor -%}{%- for message in messages %}{%- if message['content'] is string -%}{%- set msg.content = message['content'] -%}{%- else -%}{%- set msg.content = '' -%}{%- for content in message['content'] -%}{%- if content['type'] == 'image' -%}{%- set msg.content = msg.content + '<image>' -%}{%- elif content['type'] == 'video' -%}{%- set msg.content = msg.content + '<video>' -%}{%- elif content['type'] == 'text' -%}{%- set msg.content = msg.content + content['text'] -%}{%- endif -%}{%- endfor -%}{%- endif -%}{%- if message['role'] == 'system' %}{{- '<SPECIAL_10>System\n' + msg.content }}{%- if tools -%}{%- if msg.content != '' -%}{{- '\n\n' -}}{%- endif -%}{{- 'You can use the following tools to assist the user if required:\n<AVAILABLE_TOOLS>[' -}}{%- for tool in tools -%}{{- (tool.function if tool.function is defined else tool) | tojson -}}{{- ', ' if not loop.last else '' -}}{%- endfor -%}{{- ']</AVAILABLE_TOOLS>\n\nIf you decide to call any tool(s), use the following format:\n<TOOLCALL>[{{\"name\": \"tool_name1\", \"arguments\": \"tool_args1\"}}, {{\"name\": \"tool_name2\", \"arguments\": \"tool_args2\"}}]</TOOLCALL>\n\nThe user will execute tool-calls and return responses from tool(s) in this format:\n<TOOL_RESPONSE>[{{\"response\": \"tool_response1\"}}, {{\"response\": \"tool_response2\"}}]</TOOL_RESPONSE>\n\nBased on the tool responses, you can call additional tools if needed, correct tool calls if any errors are found, or just respond to the user.' -}}{%- endif -%}{{- '\n' -}}{%- elif message['role'] == 'user' %}{{- '<SPECIAL_11>User\n' + msg.content + '\n' }}{%- elif message['role'] == 'tool' %}{%- if loop.first or (messages[loop.index0 - 1].role != 'tool') -%}{{- '<SPECIAL_11>User\n' + '<TOOL_RESPONSE>[' }}{%- endif -%}{{- msg.content -}}{{- ', ' if not loop.last and (messages[loop.index0 + 1].role == 'tool') else '' -}}{%- if loop.last or (messages[loop.index0 + 1].role != 'tool') -%}{{- ']</TOOL_RESPONSE>\n' -}}{%- endif -%}{%- elif message['role'] == 'assistant' %}{%- if '</think>' in msg.content %}{%- set msg.content = msg.content %}{%- endif %}{{- '<SPECIAL_11>Assistant\n' + msg.content.strip() }}{%- if message.tool_calls -%}{%- if msg.content.strip() != '' -%}{{- '\n\n' -}}{%- endif -%}{{- '<TOOLCALL>[' -}}{%- for call in message.tool_calls -%}{%- set fn = call.function if call.function is defined else call -%}{{- '{\"name\": \"' + fn.name + '\", \"arguments\": ' -}}{%- if fn.arguments is string -%}{{- fn.arguments -}}{%- else -%}{{- fn.arguments | tojson -}}{%- endif -%}{{- '}' + (', ' if not loop.last else '') -}}{%- endfor -%}{{- ']</TOOLCALL>' -}}{%- endif -%}{{- '\n<SPECIAL_12>\n' -}}{%- endif %}{%- endfor -%}{%- if add_generation_prompt %}{{- '<SPECIAL_11>Assistant\n' }}{%- if ns.enable_thinking is defined and ns.enable_thinking is false %}{{- '<think></think>' }}{%- else %}{{- '<think>\n' }}{%- endif %}{%- endif %}"
  # number of preference samples per batch
  # each preference sample corresponds to a pair of chosen and rejected responses
  # so the actual batch size processed by the model is train_global_batch_size * 2
  train_global_batch_size: 128
  train_micro_batch_size: 1

  ## TODO(@ashors) support
  #logprob_batch_size: ${policy.train_micro_batch_size}
  max_total_sequence_length: 12000
  precision: "bfloat16"
  dtensor_cfg:
    env_vars:
      PYTORCH_CUDA_ALLOC_CONF: ""  # Refers to https://docs.pytorch.org/docs/stable/notes/cuda.html#optimizing-memory-usage-with-pytorch-cuda-alloc-conf
    enabled: true
    cpu_offload: true
    sequence_parallel: false
    activation_checkpointing: true
    tensor_parallel_size: 2
    context_parallel_size: 1
    custom_parallel_plan: null
    clear_cache_every_n_steps: null

  dynamic_batching:
    enabled: false

  sequence_packing:
    enabled: false

  # makes the training sequence length divisible by the tensor parallel size
  # this is useful for sequence parallel training
  make_sequence_length_divisible_by: ${policy.dtensor_cfg.tensor_parallel_size}
  max_grad_norm: 1.0

  optimizer:
    name: "torch.optim.AdamW"
    kwargs:
      # lr: 2e-7  # InternVL 3.5 recipe
      lr: 1e-6
      # weight_decay: 0.05  # InternVL 3.5 recipe
      weight_decay: 0.1
      # betas: [0.9, 0.999]  # InternVL 3.5 recipe
      betas: [0.9, 0.98]
      eps: 1e-8  # InternVL 3.5 recipe
      # when using Dtensor, we need to set foreach
      # and fused to False
      foreach: False
      fused: False

  scheduler:
    - name: "torch.optim.lr_scheduler.LinearLR"
      kwargs:
        start_factor: 0.01
        end_factor: 1.0
        # total_iters: 200  # InternVL 3.5 recipe (about 3%)
        total_iters: 20
    - name: "torch.optim.lr_scheduler.CosineAnnealingLR"
      kwargs:
        T_max: ${dpo.max_num_steps}
    # - milestones: [200]  # InternVL 3.5 recipe
    - milestones: [20]

  ## ignored since enabled=false, but needed for testing purposes
  megatron_cfg:
    enabled: false
    empty_unused_memory_level: 1
    activation_checkpointing: false
    tensor_model_parallel_size: 2
    expert_tensor_parallel_size: 1
    expert_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    context_parallel_size: 1
    pipeline_dtype: ${policy.precision}
    num_layers_in_first_pipeline_stage: null
    num_layers_in_last_pipeline_stage: null
    sequence_parallel: true
    freeze_moe_router: false
    moe_router_dtype: "fp64"
    moe_router_load_balancing_type: "aux_loss"
    moe_router_bias_update_rate: 1e-3
    #gives ~20% training perf speedup with sequence packing 
    apply_rope_fusion: True
    
    optimizer:
      optimizer: "adam"
      lr: 5.0e-6 #4.0e-5
      min_lr: 5.0e-6 #4.0e-5
      weight_decay: 0.1
      bf16: true
      fp16: false
      params_dtype: "float32"

      #adam
      adam_beta1: 0.9
      adam_beta2: 0.98
      adam_eps: 1e-8

      #sgd
      sgd_momentum: 0.9

      #distributed optimizer
      use_distributed_optimizer: true
      use_precision_aware_optimizer: true

      clip_grad: ${policy.max_grad_norm}

    scheduler:
      start_weight_decay: ${policy.megatron_cfg.optimizer.weight_decay}
      end_weight_decay: ${policy.megatron_cfg.optimizer.weight_decay}
      weight_decay_incr_style: "constant"
      lr_decay_style: "constant"
      lr_warmup_iters: 1
      lr_warmup_init: 0.00000001

    distributed_data_parallel_config:
      grad_reduce_in_fp32: false
      overlap_grad_reduce: true
      overlap_param_gather: true
      average_in_collective: true
      data_parallel_sharding_strategy: "optim_grads_params"

logger:
  log_dir: "logs"  # Base directory for all logs
  wandb_enabled: true # Make sure you do a ``wandb login [Your API key]'' before running

  tensorboard_enabled: false
  mlflow_enabled: false  # Disable MLflow logging
  swanlab_enabled: false # Disable SwanLab logging
  monitor_gpus: true  # If true, will monitor GPU usage and log to wandb and/or tensorboard
  num_val_samples_to_print: 0 # Number of validation samples to pretty print on terminal
  wandb:
    project: "dpo-dev-mmpr"
    name: "dpo_vlm_mmpr_w_hallucination_data"
  tensorboard:
    log_dir: "tb_logs-dpo-dev"
  mlflow:
    experiment_name: "dpo-dev"
    run_name: "dpo"
  gpu_monitoring:
    collection_interval: 10  # How often to collect GPU usage metrics (in seconds)
    flush_interval: 10  # How often to flush GPU usage metrics to the loggers (in seconds)

cluster:
  gpus_per_node: 8
  num_nodes: 1

# Checkpointing configuration
checkpointing:
  enabled: true
  checkpoint_dir: "results/dpo-dev-mmpr"
  metric_name: "val_loss"
  higher_is_better: false
  keep_top_k: 50
  save_period: 100
  checkpoint_must_save_by: "00:03:45:00"  # assuming 4 hour slurm jobs
